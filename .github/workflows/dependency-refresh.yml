name: One-time dependency lockfile refresh

on:
  push:
    branches:
      - feat/production-hardening-and-agent-tools
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/production-hardening-and-agent-tools
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - name: Resolve updated dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: resolve lockfile for security upgrades"
            git push origin HEAD:feat/production-hardening-and-agent-tools
          fi
