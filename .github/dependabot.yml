version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 5
    groups:
      safe-dependency-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 3
